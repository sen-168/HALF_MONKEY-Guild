<style>

:root {
  --gold: #e8c47b;

* {

}

html {

}

body {

  min-height: 100dvh;

}

.page {

}

.background {

.overlay {

.logo img {

}

.logo-text {

.music-button {

}

.music-button:hover {

}

.music-button:focus-visible {

}

/* AGE LABEL */

.age-label {

}

.age-label strong {

.hero-title {

}

.hero-subtitle {

/* BOTTOM BUTTONS */

.bottom-area {

.bonus-panel {

<!-- เพลงพื้นหลัง: ชื่อไฟล์ต้องตรงกับไฟล์ใน assets -->

<script>
(() => {
  const video = document.getElementById("gamePreview");
  const button = document.getElementById("videoToggle");

  if (!video || !button) return;

  function updateButton() {
    button.textContent = video.paused ? "▶" : "Ⅱ";
    button.setAttribute(
      "aria-label",
      video.paused ? "เล่นวิดีโอ" : "หยุดวิดีโอ"
    );
  }

  button.addEventListener("click", async (event) => {
    event.preventDefault();
    event.stopPropagation();

    if (video.paused) {
      try {
        await video.play();
      } catch (error) {
        console.error("เล่นวิดีโอไม่สำเร็จ:", error);
        alert("เล่นวิดีโอไม่ได้ กรุณาตรวจสอบไฟล์ game-preview.mp4 ในโฟลเดอร์ assets");
      }
    } else {
      video.pause();
    }

    updateButton();
  });

  video.addEventListener("play", updateButton);
  video.addEventListener("pause", updateButton);
  video.addEventListener("ended", updateButton);

  video.addEventListener("error", () => {
    console.error("โหลดวิดีโอไม่ได้:", video.error, video.currentSrc);
  });

  updateButton();
})();
</script>
<script>
/* ระบบเพลงพื้นหลัง: ใช้เพียงชุดเดียว */
(() => {
  const music = document.getElementById("bgMusic");
  const button = document.getElementById("musicToggle");

  if (!music || !button) {
    console.error("ไม่พบองค์ประกอบเพลงหรือปุ่มเพลง");
    return;
  }

  music.volume = 0.3;

  let manuallyPaused = false;
  let playAttempt = null;

  function updateButton() {
    const playing = !music.paused;

    button.textContent = playing ? "♪" : "♫";
    button.setAttribute("aria-label", playing ? "ปิดเพลง" : "เปิดเพลง");
    button.setAttribute("aria-pressed", String(playing));
    button.title = playing ? "ปิดเพลง" : "เปิดเพลง";
  }

  async function playMusic() {
    if (!music.paused) return true;
    if (playAttempt) return playAttempt;

    playAttempt = (async () => {
      try {
        await music.play();
        console.log("HALF MONKEY: เล่นเพลงสำเร็จ");
        return true;
      } catch (error) {
        console.warn(
          "เบราว์เซอร์ไม่อนุญาตให้เล่นเพลงในขณะนี้:",
          error.name,
          error.message
        );
        return false;
      } finally {
        playAttempt = null;
        updateButton();
      }
    })();

    return playAttempt;
  }

  button.addEventListener("click", async () => {
    if (!music.paused) {
      manuallyPaused = true;
      music.pause();
      updateButton();
      return;
    }

    manuallyPaused = false;
    const played = await playMusic();

    if (!played) {
      button.title = "เปิดเพลงไม่สำเร็จ ตรวจสอบไฟล์ assets/bg-music.mp3";
    }
  });

  music.addEventListener("play", updateButton);
  music.addEventListener("pause", updateButton);
  music.addEventListener("ended", updateButton);

  music.addEventListener("error", () => {
    console.error(
      "โหลดไฟล์เพลงไม่สำเร็จ:",
      music.currentSrc,
      music.error
    );
    button.title = "โหลดเพลงไม่ได้ ตรวจสอบไฟล์ bg-music.mp3";
  });

  // ลองเล่นอัตโนมัติเมื่อเปิดหน้า
  playMusic();

  // ถ้าถูกเบราว์เซอร์บล็อก ให้ลองใหม่เมื่อผู้ใช้แตะส่วนอื่น
  document.addEventListener("pointerdown", (event) => {
    if (event.target.closest("#musicToggle")) return;
    if (manuallyPaused) return;
    playMusic();
  });

  updateButton();
})();
</script>

<script>
/* กด Enter เพื่อไปหน้าที่ 2 */
document.addEventListener("keydown", function(event) {
  if (event.key !== "Enter" || event.repeat) return;

  if (
    event.target.matches("input, textarea, select") ||
    event.target.isContentEditable
  ) {
    return;
  }

  window.location.href = "./HALF_MONKEY_calendar_page_added.html";
});
</script>

<script>
/* ปัดหน้าจอขึ้นบนมือถือเพื่อไปหน้าที่ 2 */
(() => {
  const nextPage = "./HALF_MONKEY_calendar_page_added.html";

  let startX = 0;
  let startY = 0;
  let startTime = 0;

  document.addEventListener("touchstart", function(event) {
    if (event.touches.length !== 1) return;

    const touch = event.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    startTime = Date.now();
  }, { passive: true });

  document.addEventListener("touchend", function(event) {
    if (event.changedTouches.length !== 1) return;

    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;
    const duration = Date.now() - startTime;

    if (
      deltaY < -100 &&
      Math.abs(deltaY) > Math.abs(deltaX) * 1.3 &&
      duration < 1000
    ) {
      window.location.href = nextPage;
    }
  }, { passive: true });
})();
</script>

</body>
